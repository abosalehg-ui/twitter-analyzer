<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1d1d1f" />
    <!--
      Defense in depth. The app is fully client-side and renders every piece of user
      input through textContent, so there is no known injection point today — this
      just makes sure a future regression cannot load or exfiltrate anything.
      'unsafe-inline' is required for style-src only: the build injects CSS at runtime
      and the renderer sets element styles directly. script-src stays strict.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <title>محلّل التغريدات الذكي</title>
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">🐦</span>
          <div class="brand-text">
            <h1 id="appTitle">محلّل التغريدات الذكي</h1>
            <p id="appSubtitle">تشخيص عميق لتغريدتك</p>
          </div>
        </div>
        <div class="header-actions">
          <!-- aria-labels are replaced with localized text by applyLocale() on boot -->
          <button
            type="button"
            id="themeBtn"
            class="btn-icon"
            aria-label="تبديل المظهر بين الفاتح والداكن"
            title="تبديل المظهر بين الفاتح والداكن"
          >
            🌓
          </button>
          <button
            type="button"
            id="langBtn"
            class="btn-icon-text"
            aria-label="تبديل اللغة إلى الإنجليزية"
          >
            EN
          </button>
        </div>
      </header>

      <main class="app-main">
        <section class="composer-section" aria-labelledby="appTitle">
          <div id="composerHost" class="composer-host"></div>

          <div class="action-row">
            <button class="btn btn-primary" id="analyzeBtn" type="button">🔍 حلّل التغريدة</button>
            <button class="btn btn-secondary" id="clearBtn" type="button">🗑️ مسح</button>
            <button class="btn btn-secondary" id="compareBtn" type="button" disabled>
              ⚔️ قارن مع تغريدة أخرى
            </button>
          </div>

          <div id="compareHost" class="compare-host" hidden></div>
        </section>

        <section class="results" id="results" aria-live="polite">
          <nav id="tabsNav" class="tabs-host" aria-label="analysis sections"></nav>
          <div id="tabsPanels" class="tabs-panels-host"></div>

          <div class="post-actions">
            <button class="btn btn-secondary" id="exportTxtBtn" type="button">📥 TXT</button>
            <button class="btn btn-secondary" id="exportCsvBtn" type="button">📊 CSV</button>
            <button class="btn btn-secondary" id="exportJsonBtn" type="button">🗂️ JSON</button>
            <button class="btn btn-secondary" id="shareCardBtn" type="button">
              🖼️ بطاقة مشاركة
            </button>
            <button class="btn btn-secondary" id="saveHistoryBtn" type="button">
              💾 حفظ في السجل
            </button>
          </div>

          <div id="comparisonView" class="comparison-view" hidden></div>
        </section>

        <section class="history-section" aria-labelledby="historyHeading">
          <h2 id="historyHeading" class="section-title">🗂️ السجل</h2>
          <div id="historyList" class="history-list"></div>
        </section>

        <footer class="app-footer">
          <p>twitter-analyzer · v3.0 · client-side only</p>
        </footer>
      </main>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
